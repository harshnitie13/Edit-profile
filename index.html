<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Accordion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            color: #333;
            max-width: 375px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
        }

        /* Top Navigation Bar */
        .top-nav {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 375px;
            height: 56px;
            background: white;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 50;
        }

        .back-btn, .save-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 8px;
            min-height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .save-btn {
            color: #1976d2;
            font-weight: 600;
        }

        .page-title {
            font-size: 18px;
            font-weight: 600;
        }

        /* Profile Strength */
        .profile-strength {
            position: fixed;
            top: 56px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 375px;
            background: white;
            border-bottom: 1px solid #f0f0f0;
            padding: 12px 16px;
            z-index: 40;
        }

        .strength-text {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e5e5e5;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #1976d2;
            width: 75%;
            transition: width 0.3s ease;
        }

        /* Main Content */
        .main-content {
            padding-top: 120px;
            padding-bottom: 80px;
        }

        /* Accordion Sections */
        .accordion-section {
            border-bottom: 1px solid #e5e5e5;
        }

        .accordion-header {
            width: 100%;
            height: 48px;
            background: #f8f9fa;
            border: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            text-align: left;
        }

        .accordion-header:hover {
            background: #f0f2f5;
        }

        .chevron {
            width: 20px;
            height: 20px;
            transition: transform 0.2s ease;
        }

        .accordion-header.active .chevron {
            transform: rotate(180deg);
        }

        .accordion-content {
            display: none;
            padding: 16px;
            background: white;
        }

        .accordion-content.active {
            display: block;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            height: 48px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }

        .form-textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            font-family: inherit;
        }

        .form-select {
            width: 100%;
            height: 48px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            cursor: pointer;
        }

        .readonly-value {
            color: #666;
            font-size: 16px;
        }

        .char-counter {
            font-size: 12px;
            color: #666;
            text-align: right;
            margin-top: 4px;
        }

        .helper-text {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 8px;
        }

        /* Photo Section */
        .profile-photo {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        .photo-circle {
            width: 100px;
            height: 100px;
            background: #e5e5e5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 24px;
        }

        .change-photo-btn {
            width: 100%;
            height: 48px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .photo-slot {
            aspect-ratio: 1;
            background: #e5e5e5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 20px;
            position: relative;
            cursor: pointer;
        }

        .photo-slot.filled {
            background: #d1d5db;
        }

        .delete-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Bottom Save Button */
        .bottom-save {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 375px;
            background: white;
            border-top: 1px solid #e5e5e5;
            padding: 16px;
            z-index: 30;
        }

        .bottom-save-btn {
            width: 100%;
            height: 48px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Icons */
        .icon-back::before { content: "‹"; font-size: 24px; }
        .icon-camera::before { content: "📷"; }
        .icon-plus::before { content: "+"; }
        .icon-close::before { content: "×"; }
        .chevron::before { content: "⌄"; }
    </style>
</head>
<body>
    <!-- Top Navigation Bar -->
    <div class="top-nav">
        <button class="back-btn">
            <span class="icon-back"></span>
        </button>
        <h1 class="page-title">Edit Profile</h1>
        <button class="save-btn">Save</button>
    </div>

    <!-- Profile Strength Progress Bar -->
    <div class="profile-strength">
        <p class="strength-text">Your Profile Strength: 75% Complete</p>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Photos Section -->
        <div class="accordion-section">
            <button class="accordion-header" onclick="toggleAccordion(this)">
                <span>Photos</span>
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div class="profile-photo">
                    <div class="photo-circle">
                        <span class="icon-camera"></span>
                    </div>
                </div>
                
                <button class="change-photo-btn">Change Photo</button>
                
                <div class="photo-grid">
                    <div class="photo-slot filled">
                        <button class="delete-btn">
                            <span class="icon-close"></span>
                        </button>
                    </div>
                    <div class="photo-slot filled">
                        <button class="delete-btn">
                            <span class="icon-close"></span>
                        </button>
                    </div>
                    <div class="photo-slot">
                        <span class="icon-plus"></span>
                    </div>
                    <div class="photo-slot">
                        <span class="icon-plus"></span>
                    </div>
                    <div class="photo-slot">
                        <span class="icon-plus"></span>
                    </div>
                    <div class="photo-slot">
                        <span class="icon-plus"></span>
                    </div>
                </div>
                
                <p class="helper-text">Upload clear, recent photos to increase your profile's visibility.</p>
            </div>
        </div>

        <!-- About Me Section -->
        <div class="accordion-section">
            <button class="accordion-header" onclick="toggleAccordion(this)">
                <span>About Me</span>
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div class="form-group">
                    <label class="form-label">My Introduction / About Myself</label>
                    <textarea class="form-textarea" placeholder="Write a few lines about your personality, interests, and what you are looking for in a partner..." maxlength="500" oninput="updateCharCount(this)"></textarea>
                    <div class="char-counter">0/500 Characters</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <div class="readonly-value">Female</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Date of Birth</label>
                    <input type="text" class="form-input" placeholder="DD/MM/YYYY" readonly onclick="alert('Date picker would open here')">
                </div>

                <div class="form-group">
                    <label class="form-label">Height</label>
                    <select class="form-select">
                        <option>Select Height</option>
                        <option>5'0"</option>
                        <option>5'1"</option>
                        <option>5'2"</option>
                        <option>5'3"</option>
                        <option selected>5'4"</option>
                        <option>5'5"</option>
                        <option>5'6"</option>
                        <option>5'7"</option>
                        <option>5'8"</option>
                        <option>5'9"</option>
                        <option>5'10"</option>
                        <option>5'11"</option>
                        <option>6'0"</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Mother Tongue</label>
                    <select class="form-select">
                        <option>Select Language</option>
                        <option>English</option>
                        <option>Hindi</option>
                        <option>Tamil</option>
                        <option>Telugu</option>
                        <option>Bengali</option>
                        <option>Marathi</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Marital Status</label>
                    <select class="form-select">
                        <option>Select Status</option>
                        <option>Never Married</option>
                        <option>Divorced</option>
                        <option>Widowed</option>
                        <option>Separated</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Contact Details Section -->
        <div class="accordion-section">
            <button class="accordion-header" onclick="toggleAccordion(this)">
                <span>Contact Details</span>
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-input" placeholder="Enter phone number">
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" placeholder="Enter email address">
                </div>

                <div class="form-group">
                    <label class="form-label">City</label>
                    <input type="text" class="form-input" placeholder="Enter city">
                </div>

                <div class="form-group">
                    <label class="form-label">State</label>
                    <select class="form-select">
                        <option>Select State</option>
                        <option>Delhi</option>
                        <option>Maharashtra</option>
                        <option>Karnataka</option>
                        <option>Tamil Nadu</option>
                        <option>Gujarat</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Education & Career Section -->
        <div class="accordion-section">
            <button class="accordion-header" onclick="toggleAccordion(this)">
                <span>Education & Career</span>
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div class="form-group">
                    <label class="form-label">Highest Education</label>
                    <select class="form-select">
                        <option>Select Education</option>
                        <option>High School</option>
                        <option>Bachelor's Degree</option>
                        <option>Master's Degree</option>
                        <option>PhD</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Occupation</label>
                    <input type="text" class="form-input" placeholder="Enter occupation">
                </div>

                <div class="form-group">
                    <label class="form-label">Annual Income</label>
                    <select class="form-select">
                        <option>Select Income Range</option>
                        <option>Below 3 Lakhs</option>
                        <option>3-5 Lakhs</option>
                        <option>5-10 Lakhs</option>
                        <option>10-15 Lakhs</option>
                        <option>Above 15 Lakhs</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Family Details Section -->
        <div class="accordion-section">
            <button class="accordion-header" onclick="toggleAccordion(this)">
                <span>Family Details</span>
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div class="form-group">
                    <label class="form-label">Father's Occupation</label>
                    <input type="text" class="form-input" placeholder="Enter father's occupation">
                </div>

                <div class="form-group">
                    <label class="form-label">Mother's Occupation</label>
                    <input type="text" class="form-input" placeholder="Enter mother's occupation">
                </div>

                <div class="form-group">
                    <label class="form-label">Number of Siblings</label>
                    <select class="form-select">
                        <option>Select</option>
                        <option>0</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4+</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Family Type</label>
                    <select class="form-select">
                        <option>Select Family Type</option>
                        <option>Nuclear Family</option>
                        <option>Joint Family</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Lifestyle & Habits Section -->
        <div class="accordion-section">
            <button class="accordion-header" onclick="toggleAccordion(this)">
                <span>Lifestyle & Habits</span>
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div class="form-group">
                    <label class="form-label">Drinking Habits</label>
                    <select class="form-select">
                        <option>Select</option>
                        <option>Never</option>
                        <option>Occasionally</option>
                        <option>Regularly</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Smoking Habits</label>
                    <select class="form-select">
                        <option>Select</option>
                        <option>Never</option>
                        <option>Occasionally</option>
                        <option>Regularly</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Diet</label>
                    <select class="form-select">
                        <option>Select Diet</option>
                        <option>Vegetarian</option>
                        <option>Non-Vegetarian</option>
                        <option>Vegan</option>
                        <option>Jain Vegetarian</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Religious & Astrological Section -->
        <div class="accordion-section">
            <button class="accordion-header" onclick="toggleAccordion(this)">
                <span>Religious & Astrological</span>
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div class="form-group">
                    <label class="form-label">Religion</label>
                    <select class="form-select">
                        <option>Select Religion</option>
                        <option>Hindu</option>
                        <option>Muslim</option>
                        <option>Christian</option>
                        <option>Sikh</option>
                        <option>Buddhist</option>
                        <option>Jain</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Community</label>
                    <select class="form-select">
                        <option>Select Community</option>
                        <option>Brahmin</option>
                        <option>Kshatriya</option>
                        <option>Vaishya</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Star Sign</label>
                    <select class="form-select">
                        <option>Select Star Sign</option>
                        <option>Aries</option>
                        <option>Taurus</option>
                        <option>Gemini</option>
                        <option>Cancer</option>
                        <option>Leo</option>
                        <option>Virgo</option>
                        <option>Libra</option>
                        <option>Scorpio</option>
                        <option>Sagittarius</option>
                        <option>Capricorn</option>
                        <option>Aquarius</option>
                        <option>Pisces</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Partner Preferences Section -->
        <div class="accordion-section">
            <button class="accordion-header" onclick="toggleAccordion(this)">
                <span>Partner Preferences</span>
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div class="form-group">
                    <label class="form-label">Age Range</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <select class="form-select">
                            <option>Min Age</option>
                            <option>21</option>
                            <option>22</option>
                            <option>23</option>
                            <option>24</option>
                            <option>25</option>
                        </select>
                        <span>to</span>
                        <select class="form-select">
                            <option>Max Age</option>
                            <option>30</option>
                            <option>32</option>
                            <option>35</option>
                            <option>40</option>
                            <option>45</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Height Range</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <select class="form-select">
                            <option>Min Height</option>
                            <option>5'0"</option>
                            <option>5'2"</option>
                            <option>5'4"</option>
                            <option>5'6"</option>
                            <option>5'8"</option>
                        </select>
                        <span>to</span>
                        <select class="form-select">
                            <option>Max Height</option>
                            <option>5'8"</option>
                            <option>5'10"</option>
                            <option>6'0"</option>
                            <option>6'2"</option>
                            <option>6'4"</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Education Preference</label>
                    <select class="form-select">
                        <option>No Preference</option>
                        <option>Graduate</option>
                        <option>Post Graduate</option>
                        <option>Professional Degree</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Privacy Settings Section -->
        <div class="accordion-section">
            <button class="accordion-header" onclick="toggleAccordion(this)">
                <span>Privacy Settings</span>
                <span class="chevron"></span>
            </button>
            <div class="accordion-content">
                <div class="form-group">
                    <label class="form-label">Profile Visibility</label>
                    <select class="form-select">
                        <option>Visible to All</option>
                        <option>Visible to Premium Members Only</option>
                        <option>Hidden</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Photo Privacy</label>
                    <select class="form-select">
                        <option>Visible to All</option>
                        <option>Visible to Connected Members</option>
                        <option>Password Protected</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Contact Details Privacy</label>
                    <select class="form-select">
                        <option>Visible to Premium Members</option>
                        <option>Visible to Connected Members</option>
                        <option>Hidden</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Sticky Save Button -->
    <div class="bottom-save">
        <button class="bottom-save-btn">Save Changes</button>
    </div>

    <script>
        function toggleAccordion(header) {
            const content = header.nextElementSibling;
            const isActive = content.classList.contains('active');
            
            // Close all accordion sections
            document.querySelectorAll('.accordion-content').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.accordion-header').forEach(h => {
                h.classList.remove('active');
            });
            
            // Open clicked section if it wasn't active
            if (!isActive) {
                content.classList.add('active');
                header.classList.add('active');
            }
        }

        function updateCharCount(textarea) {
            const counter = textarea.parentNode.querySelector('.char-counter');
            const currentLength = textarea.value.length;
            const maxLength = textarea.getAttribute('maxlength');
            counter.textContent = `${currentLength}/${maxLength} Characters`;
        }

        // Auto-expand first section on load
        document.addEventListener('DOMContentLoaded', function() {
            const firstHeader = document.querySelector('.accordion-header');
            if (firstHeader) {
                firstHeader.click();
            }
        });
    </script>
</body>
</html>
